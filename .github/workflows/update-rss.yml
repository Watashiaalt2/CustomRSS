name: Update RSS Feed

on:
  schedule:
    # Runs every six hours at minute 17 (UTC)
    - cron: '17 */6 * * *'
  workflow_dispatch: # Allows you to trigger it manually via the Actions tab
  push:
    branches: [main]
    paths: ['generate-rss.js', '.github/workflows/update-rss.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Allows the bot to commit the xml file back to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate RSS Feed
        run: node generate-rss.js

      - name: Commit and push changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add feed.xml
          if git diff --cached --quiet; then
            echo 'No changes to feed.xml'
          else
            git commit -m 'Automated RSS Feed Update'
            git push
          fi

      - name: Prepare Pages feed
        run: |
          mkdir -p _site
          cp feed.xml _site/feed.xml

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy feed to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
